[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ouroboros-rsi"
version = "0.1.0"
description = "A harness for recursive self-improvement."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jack Qu"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
